name: careertrack-auth-local

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME belum diisi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  auth:
    image: careertrack/auth-service:devops-1
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME belum diisi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET belum diisi}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME belum diisi}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL belum diisi}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD belum diisi}
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data: