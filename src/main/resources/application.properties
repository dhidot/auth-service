spring.application.name=auth-service
server.port=8081

# Database: default untuk aplikasi/tests yang dijalankan dari laptop
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/auth_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

logging.level.org.springframework.security=INFO

# Health probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Admin bootstrap
app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
# Register -> Notification Service (private service-to-service call).
# In production set NOTIFICATION_SERVICE_URL to the private service address and
# VERIFICATION_PAGE_URL to the public Next.js verification page (HTTPS).
careertrack.notification.enabled=${NOTIFICATION_ENABLED:false}
careertrack.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
careertrack.notification.internal-api-key=${NOTIFICATION_INTERNAL_API_KEY:}
careertrack.notification.verification-page-url=${VERIFICATION_PAGE_URL:http://localhost:3000/verify-email}
